<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Question import and presentation flow</title>
  <desc id="desc">A pinned AI Engineering MCQ source flows through a complete-question filter, then into the local question bank. The browser schema validates the bank before the quiz presents shuffled choices and their matching explanations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1558b0"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #1a73e8; stroke-width: 2; rx: 14; }
      .title { fill: #172033; font: 700 18px Arial, sans-serif; }
      .copy { fill: #5f6f89; font: 14px Arial, sans-serif; }
      .arrow { stroke: #1558b0; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .reject { fill: #fce8e6; stroke: #b3261e; stroke-width: 2; rx: 10; }
    </style>
  </defs>
  <rect width="1000" height="300" fill="#f4f7fb"/>
  <rect class="box" x="35" y="85" width="185" height="115"/>
  <text class="title" x="57" y="123">Pinned upstream</text>
  <text class="copy" x="57" y="149">AI Engineering MCQ</text>
  <text class="copy" x="57" y="171">commit and MIT claim</text>
  <path class="arrow" d="M220 142 H302"/>
  <rect class="box" x="305" y="65" width="210" height="155"/>
  <text class="title" x="328" y="106">Importer filter</text>
  <text class="copy" x="328" y="135">4 unique choices</text>
  <text class="copy" x="328" y="157">valid correct index</text>
  <text class="copy" x="328" y="179">4 nonempty explanations</text>
  <path class="arrow" d="M515 142 H597"/>
  <rect class="box" x="600" y="85" width="175" height="115"/>
  <text class="title" x="622" y="123">questions.js</text>
  <text class="copy" x="622" y="149">static, attributed bank</text>
  <text class="copy" x="622" y="171">option text + rationale</text>
  <path class="arrow" d="M775 142 H857"/>
  <rect class="box" x="860" y="85" width="105" height="115"/>
  <text class="title" x="876" y="123">Quiz</text>
  <text class="copy" x="876" y="149">validate</text>
  <text class="copy" x="876" y="171">shuffle</text>
  <rect class="reject" x="312" y="242" width="196" height="38"/>
  <text class="copy" x="330" y="267">Incomplete records are skipped</text>
  <path d="M410 220 V237" stroke="#b3261e" stroke-width="2"/>
</svg>
